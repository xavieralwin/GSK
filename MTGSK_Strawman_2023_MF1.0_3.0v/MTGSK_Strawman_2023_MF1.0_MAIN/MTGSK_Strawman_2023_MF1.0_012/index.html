    <body>
    <div id="container" data-slide="MTGSK_Strawman_2023_MF1.0_012">
        <!-- Left and right double click navigation -->
        <div id="doubleClickLeft" class="navBumper"></div>
        <div id="doubleClickRight" class="navBumper"></div>
        <!-- Portrait mode double click zoom -->
        <div id="doubleClickCentre"></div>

        <!-- slide html -->
        <div class="mainContent contentFrame" id="contentFrame">
            <div class="pageTitle">Clickstream with form</div>
                    <div class="bodyText">
                        
                            <label><input id="slide12checkbox" type="checkbox" data-fields="SurveyQuestion|Answer" data-description="formCheckbox|checked" class="logFormField" /> <span>Checkbox</span></label><br /><br />
                            <select id="slide12select" class="logFormField" data-fields="SurveyQuestion|Answer" data-description="formSelect|[data]">
                                <option value="Option One">One</option>
                                <option value="Option Two">Two</option>
                                <option value="Option Three">Three</option>
                            </select><br /><br />
                            <label><input id="slide12radio1" type="radio" name="radio" class="logFormField" data-fields="SurveyQuestion|Answer" data-description="formRadio|[data]" value="Option One" checked> <span>Option One</span></label><br />
                            <label><input id="slide12radio2" type="radio" name="radio" class="logFormField" data-fields="SurveyQuestion|Answer" data-description="formRadio|[data]" value="Option Two"> <span>Option Two</span></label><br /><br /><br />
                            <div class="slider-container noSwipe">
                                <div id="slide12slider" class="slider logFormField" data-fields="SurveyQuestion|Answer" data-description="slider value|[data]" data-min="0" data-max="100" data-step="10" data-value="50"></div>
                            </div>
                            <br /><br />
                            <button id="slide12submit" class="logFormSubmit" data-onetime="1" data-callback-name="OnClickstreamDone">Submit Form</button>
                       
                    </div>
        </div>
        <!-- end of slide html -->

        <!-- mtgsk html -->
        <div class="footer">
            <img src="../shared/media/images/footerlogo_new.png"/>
        </div>
        <div class="navBottom">
